# Huy Locket Web — Railway
#
# Service huy-locket (web):
#   Root Directory: . (hoặc trống)
#   Dockerfile: Dockerfile
#   Variables BẮT BUỘC:
#     LOCKET_API_UPSTREAM=https://huy-locket-api-production.up.railway.app
#     DATABASE_URL=<Neon pooled connection string — Drive OAuth bền, KHÔNG commit>
#     COOKIE_SECRET=<chuỗi dài cố định>
#
# Service huy-locket-api:
#   Root Directory: api
#   Dockerfile: Dockerfile
#   Variables:
#     CORS_ORIGINS=https://huy-locket-production.up.railway.app
#     DATABASE_URL=<Neon pooled connection string — Celebrity/Admin data, KHÔNG commit>
#     LOCKETDIO_SIGNATURE_SECRET=<chuỗi dài cố định — đừng Generate mỗi lần>
#     LOCKETDIO_JWT_SECRET=<cố định>
#     COOKIE_SECRET=<cố định>
#     JWT_SECRET=<chuỗi ngẫu nhiên tối thiểu 32 ký tự, dùng riêng cho Admin PIN/2FA>
#     ADMIN_LOCKET_UIDS=<UID Admin, có thể phân tách bằng dấu phẩy>
#     ADMIN_LOCKET_EMAILS=<email Admin, có thể phân tách bằng dấu phẩy>
#     SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET
#     FIREBASE_API_KEY=<set trên Railway Variables — không commit key>

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  healthcheckPath = "/"
  healthcheckTimeout = 30
  restartPolicyType = "ON_FAILURE"
