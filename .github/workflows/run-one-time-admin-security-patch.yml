name: One-time admin security patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-branch:
    if: ${{ contains(github.event.head_commit.message, '[trigger-admin-security-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/admin-2fa-cookie-only
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply exact patch
        run: node scripts/apply-admin-security-hardening.mjs

      - name: Commit patched sources to security branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/routes/adminRoutes.js src/services/AdminAuthService.js api/src/services/locketAdminVerifier.js vercel.json api/package.json package.json .github/workflows/quality-gate.yml api/tests/adminSecurity.test.js api/.env.example railway.toml
          git commit -m "security: harden admin JWT and trusted-device cookie [security-patch-applied]"
          git push origin HEAD:security/admin-2fa-cookie-only
